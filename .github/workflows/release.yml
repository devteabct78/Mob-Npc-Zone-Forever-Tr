name: Manual Package and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiyon Numarası (Boş bırakırsanız otomatik sayı atanır)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub'da otomatik Tag ve Release oluşturabilmesi için gerekli yetki
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set Version and Create Tag
        run: |
          # 1. Eğer kutucuğu boş bırakıp çalıştırırsan, GitHub Action sayacını kullanarak otomatik versiyon oluşturur
          if [ -z "${{ github.event.inputs.version }}" ]; then
            AUTO_VERSION="1.0.${{ github.run_number }}"
          else
            AUTO_VERSION="${{ github.event.inputs.version }}"
          fi
          
          # 2. Tag isminin başına istediğin metni ekliyoruz (Boşluk yerine tire kullanmak zorunludur)
          TAG_NAME="WowTR-Mob-Npc-Zone-$AUTO_VERSION"
          
          echo "Oluşturulan Tag: $TAG_NAME"
          
          # 3. GitHub botu kimliğiyle tag'i yerel olarak oluşturuyoruz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          
          # 4. Tag'i GitHub sistemine kalıcı olarak kaydediyoruz
          git push origin "$TAG_NAME"

      - name: Build and Deploy to CurseForge & GitHub
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # (Opsiyonel) CurseForge ile birlikte GitHub Releases kısmına da atması için